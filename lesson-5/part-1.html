<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дослідження залежності опору від температури</title>
    
    <!-- Plotly.js для інтерактивних графіків -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <!-- MathJax для форматування математичних формул -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
        }

        input {
            width: 70px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .result-item {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
        }

        .result-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        #plot {
            width: 100%;
            height: 520px;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; font-size: 1.6rem; margin-bottom: 25px;">
        Лабораторна робота: Дослідження залежності опору $R(t)$ від температури
    </h1>

    <div class="container">
        <!-- Панель вхідних даних -->
        <div class="card">
            <h2>Експериментальні дані</h2>
            <table>
                <thead>
                    <tr>
                        <th>$t$, °C</th>
                        <th>$R$, Ом</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <!-- Заповнюється скриптом -->
                </tbody>
            </table>

            <h2>Результати</h2>
            <div class="results-grid">
                <div class="result-item">
                    <div class="result-label">Опір при $0^\circ\text{C}$ ($R_0$)</div>
                    <div class="result-value" id="resR0">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Температурний коефіцієнт ($\alpha$)</div>
                    <div class="result-value" id="resAlpha">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Рівняння лінії тренду $R(t)$</div>
                    <div class="result-value" id="resEquation">-</div>
                </div>
            </div>
        </div>

        <!-- Панель графіка -->
        <div class="card" style="padding: 10px;">
            <div id="plot"></div>
        </div>
    </div>

    <script>
        const initialData = [
            { t: 20, R: 0.087 },
            { t: 30, R: 0.090 },
            { t: 40, R: 0.093 },
            { t: 50, R: 0.096 },
            { t: 60, R: 0.099 },
            { t: 70, R: 0.102 },
            { t: 80, R: 0.105 },
            { t: 90, R: 0.109 }
        ];

        function initTable() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';
            initialData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                tr.innerHTML = `
                    <td><input type="number" value="${row.t}" onchange="updateCalculations()" data-idx="${index}" data-key="t"></td>
                    <td><input type="number" step="0.001" value="${row.R}" onchange="updateCalculations()" data-idx="${index}" data-key="R"></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function calculateLinearRegression(tVals, rVals) {
            const n = tVals.length;
            let sumT = 0, sumR = 0, sumTR = 0, sumT2 = 0;

            for (let i = 0; i < n; i++) {
                sumT += tVals[i];
                sumR += rVals[i];
                sumTR += tVals[i] * rVals[i];
                sumT2 += tVals[i] * tVals[i];
            }

            const slope = (n * sumTR - sumT * sumR) / (n * sumT2 - sumT * sumT);
            const R0 = (sumR - slope * sumT) / n;
            const alpha = slope / R0;

            return { slope, R0, alpha };
        }

        function updateCalculations() {
            const inputs = document.querySelectorAll('#dataTable input');
            const tVals = [];
            const rVals = [];

            inputs.forEach(input => {
                const idx = input.dataset.idx;
                const key = input.dataset.key;
                if (!tVals[idx]) tVals[idx] = 0;
                if (!rVals[idx]) rVals[idx] = 0;

                if (key === 't') tVals[idx] = parseFloat(input.value) || 0;
                if (key === 'R') rVals[idx] = parseFloat(input.value) || 0;
            });

            const reg = calculateLinearRegression(tVals, rVals);

            // Оновлення текстових блоків
            document.getElementById('resR0').textContent = `${reg.R0.toFixed(4)} Ом`;
            document.getElementById('resAlpha').textContent = `${reg.alpha.toFixed(5)} °C⁻¹`;
            document.getElementById('resEquation').textContent = `R(t) = ${reg.slope.toFixed(6)} · t + ${reg.R0.toFixed(4)}`;

            // Початок лінії тренду від 0 °C до максимальної температури + 5 °C
            const minT = 0;
            const maxT = Math.max(...tVals) + 5;
            const trendT = [];
            const trendR = [];

            for (let t = minT; t <= maxT; t += 0.2) {
                trendT.push(t);
                trendR.push(reg.slope * t + reg.R0);
            }

            // Експериментальні точки
            const traceExp = {
                x: tVals,
                y: rVals,
                mode: 'markers',
                type: 'scatter',
                name: 'Дослід',
                marker: { color: '#ef4444', size: 10 },
                hovertemplate: '<b>[Дослід]</b><br>Температура: %{x} °C<br>Опір: %{y:.3f} Ом<extra></extra>'
            };

            // Лінія тренду (з починанням від 0 °C)
            const traceTrend = {
                x: trendT,
                y: trendR,
                mode: 'lines',
                type: 'scatter',
                name: 'Лінія тренду R(t)',
                line: { color: '#38bdf8', width: 2.5 },
                hovertemplate: '<b>[Тренд R(t)]</b><br>Температура: %{x:.1f} °C<br>Опір: %{y:.4f} Ом<extra></extra>'
            };

            // Окрема точка для R0 при 0 °C
            const traceR0 = {
                x: [0],
                y: [reg.R0],
                mode: 'markers+text',
                type: 'scatter',
                name: 'Опір R₀ (0 °C)',
                marker: { color: '#f59e0b', size: 12, symbol: 'star' },
                text: [`  R₀ = ${reg.R0.toFixed(4)} Ом`],
                textposition: 'top right',
                textfont: { color: '#f59e0b', size: 13 },
                hovertemplate: '<b>[Екстраполяція]</b><br>Температура: 0 °C<br>Опір R₀: %{y:.4f} Ом<extra></extra>'
            };

            const layout = {
                paper_bgcolor: '#1e293b',
                plot_bgcolor: '#0f172a',
                title: {
                    text: 'Залежність опору R від температури t',
                    font: { color: '#f8fafc', size: 16 }
                },
                xaxis: {
                    title: 'Температура t, °C',
                    color: '#94a3b8',
                    gridcolor: '#334155',
                    zerolinecolor: '#f8fafc',
                    zerolinewidth: 2,
                    range: [-2, maxT] // Показуємо від 0 °C
                },
                yaxis: {
                    title: 'Опір R, Ом',
                    color: '#94a3b8',
                    gridcolor: '#334155',
                    zerolinecolor: '#475569'
                },
                legend: {
                    font: { color: '#f8fafc' },
                    x: 0.05,
                    y: 0.95
                },
                hovermode: 'closest',
                margin: { l: 60, r: 30, t: 50, b: 50 }
            };

            Plotly.newPlot('plot', [traceTrend, traceExp, traceR0], layout, { responsive: true });

            if (window.MathJax && MathJax.typeset) {
                MathJax.typeset();
            }
        }

        window.onload = () => {
            initTable();
            updateCalculations();
        };
    </script>
</body>
</html>
